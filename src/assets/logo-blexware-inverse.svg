<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="100%" height="100%">
  <defs>
    <!-- Silver-to-white gradient for dark mode readability -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C0C0C0" />
    </linearGradient>
  </defs>

  <!-- Transparent background by default -->
  <g transform="translate(50, 205)">
    <!-- BLEX in original Sage Green -->
    <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="190" fill="#A0C8B0" letter-spacing="-2px">BLEX</text>
    
    <!-- ware in White-to-Silver Gradient -->
    <text font-family="'Arial', 'Helvetica', sans-serif" font-weight="700" font-size="190" x="500" fill="url(#silverGradient)" letter-spacing="-1px">ware</text>
  </g>
</svg>
